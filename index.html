<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SYK's Crypto Dashboard</title>

<style>
:root {
    --bg: #0c0f12;
    --panel: #161a1e;
    --text: #ffffff;
    --accent: #00ffcc;
    --input: #23282f;
}

.light-theme {
    --bg: #f4f6f9;
    --panel: #ffffff;
    --text: #000000;
    --accent: #0284c7;
    --input: #e2e8f0;
}

body {
    background: var(--bg);
    color: var(--text);
    font-family: Arial, sans-serif;
    margin: 0;
}

/* TITLE SCREEN */
#title-screen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(12, 15, 18, 0.95);
    backdrop-filter: blur(10px);
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    z-index: 10000;
}

.theme-btn {
    padding: 15px 30px;
    margin: 10px;
    cursor: pointer;
    font-size: 1.1rem;
    border: none;
    border-radius: 8px;
    font-weight: bold;
}

.dark-btn { background: #161a1e; color: #fff; border: 1px solid #00ffcc; }
.light-btn { background: #fff; color: #000; border: 1px solid #0284c7; }

/* MAIN */
#main-app {
    padding: 20px;
}

.nav-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
}

.switch-btn {
    padding: 10px 15px;
    cursor: pointer;
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--accent);
    border-radius: 5px;
}

/* DASHBOARD */
.dashboard-container {
    display: flex;
    gap: 20px;
}

#chart-box {
    flex: 2.5;
    height: 500px;
    background: var(--panel);
    border-radius: 8px;
}

#tv-widget {
    width: 100%;
    height: 100%;
}

#coin-list {
    flex: 1;
}

.crypto-card {
    background: var(--panel);
    padding: 12px;
    margin-bottom: 8px;
    border-radius: 6px;
    cursor: pointer;
}
</style>
</head>

<body>

<!-- TITLE SCREEN -->
<div id="title-screen">
    <h1>SYK's Crypto Dashboard</h1>
    <p>Choose Theme</p>

    <button class="theme-btn dark-btn" onclick="selectTheme('dark')">🌙 Dark Mode</button>
    <button class="theme-btn light-btn" onclick="selectTheme('light')">☀️ Light Mode</button>
</div>

<!-- MAIN APP -->
<div id="main-app">

    <div class="nav-bar">
        <h2>Crypto Tracker</h2>
        <button class="switch-btn" onclick="toggleTheme()">🌓 Switch Theme</button>
    </div>

    <div class="dashboard-container">

        <!-- CHART -->
        <div id="chart-box">
            <div id="tv-widget"></div>
        </div>

        <!-- COINS -->
        <div id="coin-list">
            <div class="crypto-card" onclick="changeChart('BTC')">BTC</div>
            <div class="crypto-card" onclick="changeChart('ETH')">ETH</div>
            <div class="crypto-card" onclick="changeChart('SOL')">SOL</div>
            <div class="crypto-card" onclick="changeChart('BNB')">BNB</div>
            <div class="crypto-card" onclick="changeChart('XRP')">XRP</div>
        </div>

    </div>
</div>

<!-- TRADINGVIEW SCRIPT -->
<script src="https://s3.tradingview.com/tv.js"></script>

<script>

let currentTheme = "dark";
let currentSymbol = "BTC";
let widget = null;

function selectTheme(theme){
    currentTheme = theme;

    if(theme === "light"){
        document.body.classList.add("light-theme");
    }

    document.getElementById("title-screen").style.display = "none";

    loadChart("BTC");
}

function toggleTheme(){
    document.body.classList.toggle("light-theme");
    currentTheme = currentTheme === "dark" ? "light" : "dark";
    loadChart(currentSymbol);
}

function changeChart(symbol){
    currentSymbol = symbol;
    loadChart(symbol);
}

function loadChart(symbol){

    if(widget){
        widget.remove();
    }

    widget = new TradingView.widget({
        container_id: "tv-widget",
        width: "100%",
        height: "100%",
        symbol: "BINANCE:" + symbol + "USDT",
        interval: "30",
        timezone: "Etc/UTC",
        theme: currentTheme,
        style: "1",
        locale: "en",
        allow_symbol_change: true
    });
}

// default load
loadChart("BTC");

</script>

</body>
</html>
