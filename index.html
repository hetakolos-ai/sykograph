<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SYK's Crypto Dashboard</title>

<style>
:root {
    --bg: #0c0f12;
    --panel: #161a1e;
    --text: #ffffff;
    --accent: #00ffcc;
    --input: #23282f;
}

.light-theme {
    --bg: #f4f6f9;
    --panel: #ffffff;
    --text: #000000;
    --accent: #0284c7;
    --input: #e2e8f0;
}

body {
    background: var(--bg);
    color: var(--text);
    font-family: Arial;
    margin: 0;
}

/* TITLE SCREEN */
#title-screen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(12, 15, 18, 0.95);
    backdrop-filter: blur(10px);
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    z-index: 10000;
}

#title-screen h1 {
    font-size: 2.8rem;
    margin-bottom: 5px;
    color: #ffffff;
}

.author-tag {
    color: var(--accent);
    font-size: 1.1rem;
    font-weight: bold;
    margin-bottom: 25px;
    letter-spacing: 1px;
}

.theme-btn {
    padding: 15px 30px;
    margin: 10px;
    cursor: pointer;
    font-size: 1.1rem;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    transition: transform 0.2s;
}

.theme-btn:hover {
    transform: scale(1.05);
}

.dark-btn { background: #161a1e; color: #ffffff; border: 1px solid #00ffcc; }
.light-btn { background: #ffffff; color: #000000; border: 1px solid #0284c7; }

/* MAIN APP */
#main-app {
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.nav-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
}

.nav-controls {
    display: flex;
    align-items: center;
    gap: 10px;
}

/* 🔍 SEARCH STYLES */
.search-container {
    display: flex;
    align-items: center;
    background: var(--input);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 6px;
    padding: 2px 5px;
}

.light-theme .search-container {
    border: 1px solid rgba(0,0,0,0.1);
}

.search-input {
    background: transparent;
    border: none;
    color: var(--text);
    padding: 8px 12px;
    font-size: 0.95rem;
    outline: none;
    width: 160px;
}

.search-btn {
    background: var(--accent);
    color: #000000;
    border: none;
    padding: 8px 15px;
    border-radius: 4px;
    cursor: pointer;
    font-weight: bold;
    font-size: 0.9rem;
}

.switch-btn {
    padding: 10px 20px;
    cursor: pointer;
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--accent);
    border-radius: 5px;
}

/* DASHBOARD LAYOUT */
.dashboard-container {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
}

#chart {
    flex: 2.5;
    min-width: 300px;
    height: 500px;
    background: var(--panel);
    border-radius: 8px;
}

#coin-list {
    flex: 1;
    min-width: 280px;
    max-height: 500px;
    overflow-y: auto;
    background: var(--panel);
    padding: 10px;
    border-radius: 8px;
}

.crypto-card {
    background: rgba(255,255,255,0.04);
    padding: 12px 15px;
    margin-bottom: 8px;
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: background 0.2s;
}

.light-theme .crypto-card {
    background: rgba(0,0,0,0.04);
}

.crypto-card:hover {
    background: var(--accent);
    color: #000000 !important;
}

.crypto-card:hover div, .crypto-card:hover span {
    color: #000000 !important;
}
</style>
</head>

<body>

<!-- 🎬 Title / Splash Screen -->
<div id="title-screen">
    <h1>SYK's Crypto Dashboard</h1>
    <div class="author-tag">made by koli</div>
    <p style="color: #aaa; margin-bottom: 20px;">Pick your starting theme style:</p>
    <div>
        <button class="theme-btn dark-btn" onclick="selectTheme('dark')">🌙 Dark Mode</button>
        <button class="theme-btn light-btn" onclick="selectTheme('light')">☀️ Light Mode</button>
    </div>
</div>

<!-- 📊 Main App Screen -->
<div id="main-app">
    <div class="nav-bar">
        <h1>SYK's Live Tracker</h1>
        
        <div class="nav-controls">
            <!-- 🔍 Search Box (Top Right) -->
            <div class="search-container">
                <input type="text" id="crypto-search" class="search-input" placeholder="Search coin (e.g. SOL, DOGE)..." onkeydown="handleSearchKeyPress(event)">
                <button class="search-btn" onclick="executeSearch()">Go</button>
            </div>
            
            <button class="switch-btn" onclick="toggleTheme()">🌓 Switch Theme</button>
        </div>
    </div>

    <div class="dashboard-container">
        <!-- TradingView Chart -->
        <div id="chart"></div>

        <!-- Dynamic Crypto List -->
        <div id="coin-list">
            <p style="padding: 10px;">Loading live market tickers...</p>
        </div>
    </div>
</div>

<!-- TradingView Widget Script -->
<script src="https://tradingview.com"></script>

<script>
let currentTheme = "dark";
let currentSymbol = "BTC";

// 1. Theme Picker from Title Screen
function selectTheme(theme){
    currentTheme = theme;
    if(theme === "light"){
        document.body.classList.add("light-theme");
    }
    document.getElementById("title-screen").style.display = "none";
    loadChart(currentSymbol);
    fetchCryptoPrices();
}

// 2. Toggle Theme Inside App
function toggleTheme(){
    document.body.classList.toggle("light-theme");
    currentTheme = currentTheme === "dark" ? "light" : "dark";
    loadChart(currentSymbol);
}

// 3. Load TradingView Widget
function loadChart(symbol){
    currentSymbol = symbol.toUpperCase();
    document.getElementById("chart").innerHTML = "";

    new TradingView.widget({
        container_id: "chart",
        width: "100%",
        height: "100%",
        symbol: "BINANCE:" + currentSymbol + "USDT",
        interval: "30",
        theme: currentTheme,
        style: "1",
        toolbar_bg: currentTheme === "dark" ? "#161a1e" : "#ffffff",
        enable_publishing: false,
        hide_side_toolbar: false,
        allow_symbol_change: true
    });
}

// 🔍 4. Handle Live Search Functions
function executeSearch() {
    const inputField = document.getElementById("crypto-search");
    const query = inputField.value.trim();
    if (query !== "") {
        loadChart(query);
        inputField.value = ""; // Clear input after search
    }
}

function handleSearchKeyPress(event) {
    if (event.key === "Enter") {
        executeSearch();
    }
}

// 5. Fetch Live Data - Scaled down to Top 10 with auto failover loop
async function fetchCryptoPrices() {
    try {
        const response = await fetch("https://coincap.io");
        const json = await response.json();
        const coins = json.data;
        
        const listContainer = document.getElementById("coin-list");
        listContainer.innerHTML = ""; 

        coins.forEach(coin => {
            const displaySymbol = coin.symbol.toUpperCase();
            const price = parseFloat(coin.priceUsd);
            const percentage = parseFloat(coin.changePercent24Hr);
            
            const changeColor = percentage >= 0 ? "#00ffcc" : "#ff4a5a";
            const prefix = percentage >= 0 ? "+" : "";

            const coinCard = document.createElement("div");
            coinCard.className = "crypto-card";
            coinCard.setAttribute("onclick", `loadChart('${displaySymbol}')`);
            
            coinCard.innerHTML = `
                <div><strong>${displaySymbol}</strong><div style="font-size:0.75rem; color:#888;">${coin.name}</div></div>
                <div style="text-align: right;">
                    <div style="font-weight: bold;">$${price.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}</div>
                    <span style="color: ${changeColor}; font-size: 0.85rem; font-weight: bold;">${prefix}${percentage.toFixed(2)}%</span>
                </div>
            `;
            listContainer.appendChild(coinCard);
        });
    } catch (error) {
        document.getElementById("coin-list").innerHTML = "<p style='color:orange; padding:10px;'>Refreshing connection metrics...</p>";
        console.error("API Error:", error);
        setTimeout(fetchCryptoPrices, 1500);
    }
}
</script>

</body>
</html>
