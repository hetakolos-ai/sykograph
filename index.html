<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SYK Crypto Pro Dashboard</title>

<style>
:root{
    --bg:#0b0f14;
    --panel:#151b22;
    --text:#ffffff;
    --accent:#00ffcc;
    --muted:#8a8f98;
}

.light-theme{
    --bg:#f5f7fb;
    --panel:#ffffff;
    --text:#0a0a0a;
    --accent:#2563eb;
    --muted:#555;
}

body{
    margin:0;
    font-family:Arial;
    background:var(--bg);
    color:var(--text);
}

#title{
    position:fixed;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:rgba(0,0,0,0.85);
    z-index:9999;
}

button{
    cursor:pointer;
}

.theme-btn{
    padding:12px 20px;
    margin:8px;
    border-radius:8px;
    border:none;
    font-weight:bold;
}

#app{
    display:none;
    padding:15px;
}

.nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
}

.search{
    display:flex;
    background:var(--panel);
    border-radius:8px;
    overflow:hidden;
}

.search input{
    border:none;
    outline:none;
    padding:10px;
    background:transparent;
    color:var(--text);
    width:180px;
}

.search button{
    background:var(--accent);
    border:none;
    padding:10px 14px;
    font-weight:bold;
}

.container{
    display:flex;
    gap:15px;
    margin-top:15px;
    flex-wrap:wrap;
}

#chart{
    flex:2;
    min-width:320px;
    height:520px;
    background:var(--panel);
    border-radius:10px;
}

#list{
    flex:1;
    min-width:260px;
    background:var(--panel);
    border-radius:10px;
    padding:10px;
    max-height:520px;
    overflow:auto;
}

.coin{
    display:flex;
    justify-content:space-between;
    padding:10px;
    margin-bottom:8px;
    border-radius:8px;
    background:rgba(255,255,255,0.03);
    cursor:pointer;
    transition:0.2s;
}

.coin:hover{
    background:var(--accent);
    color:#000;
}

.price{
    font-size:0.8rem;
    color:var(--muted);
}

.star{
    cursor:pointer;
}
</style>
</head>

<body>

<!-- SPLASH -->
<div id="title">
    <h1>SYK Crypto Pro</h1>
    <p style="color:#aaa">Choose theme</p>
    <div>
        <button class="theme-btn" style="background:#111;color:#fff" onclick="start('dark')">Dark</button>
        <button class="theme-btn" style="background:#fff" onclick="start('light')">Light</button>
    </div>
</div>

<!-- APP -->
<div id="app">

<div class="nav">
    <h2>Crypto Pro Dashboard</h2>

    <div class="search">
        <input id="search" placeholder="BTC, ETH..." onkeydown="key(event)">
        <button onclick="search()">Go</button>
    </div>

    <button onclick="toggleTheme()">Theme</button>
</div>

<div class="container">

    <div id="chart"></div>

    <div id="list"></div>

</div>

</div>

<!-- TradingView -->
<script src="https://s3.tradingview.com/tv.js"></script>

<script>
let theme="dark";
let current="BTC";
let watch=[];

const coins=["BTC","ETH","SOL","BNB","XRP","ADA","DOGE","AVAX","DOT","LINK"];

function start(t){
    theme=t;
    document.getElementById("title").style.display="none";
    document.getElementById("app").style.display="block";
    load(current);
    loadPrices();
    setInterval(loadPrices,10000);
}

function toggleTheme(){
    document.body.classList.toggle("light-theme");
    theme = theme==="dark"?"light":"dark";
    load(current);
}

function load(symbol){
    current=symbol;

    if(!window.TradingView){
        setTimeout(()=>load(symbol),500);
        return;
    }

    document.getElementById("chart").innerHTML="";

    new TradingView.widget({
        container_id:"chart",
        width:"100%",
        height:"100%",
        symbol:"BINANCE:"+symbol+"USDT",
        interval:"30",
        theme:theme,
        style:"1",
        locale:"en"
    });
}

function search(){
    const v=document.getElementById("search").value.trim().toUpperCase();
    if(v) load(v);
}

function key(e){
    if(e.key==="Enter") search();
}

function toggleWatch(c){
    if(watch.includes(c)){
        watch=watch.filter(x=>x!==c);
    }else{
        watch.push(c);
    }
    render();
}

async function loadPrices(){
    try{
        const res=await fetch("https://api.binance.com/api/v3/ticker/price");
        const data=await res.json();

        const map={};
        data.forEach(d=>{
            const sym=d.symbol.replace("USDT","");
            map[sym]=parseFloat(d.price).toFixed(2);
        });

        render(map);
    }catch(e){
        console.log("price error");
    }
}

function render(prices={}){
    const list=document.getElementById("list");
    list.innerHTML="";

    coins.forEach(c=>{
        const el=document.createElement("div");
        el.className="coin";

        el.innerHTML=`
            <div onclick="load('${c}')">
                <b>${c}</b>
                <div class="price">$${prices[c]||"..."}</div>
            </div>
            <div class="star" onclick="toggleWatch('${c}')">
                ${watch.includes(c)?"⭐":"☆"}
            </div>
        `;

        list.appendChild(el);
    });
}
</script>

</body>
</html>
