<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SYK's Crypto Dashboard</title>

<style>
:root {
    --bg: #0c0f12;
    --panel: #161a1e;
    --text: #ffffff;
    --accent: #00ffcc;
    --input: #23282f;
}

.light-theme {
    --bg: #f4f6f9;
    --panel: #ffffff;
    --text: #000000;
    --accent: #0284c7;
    --input: #e2e8f0;
}

body {
    background: var(--bg);
    color: var(--text);
    font-family: Arial, sans-serif;
    margin: 0;
}

/* TITLE SCREEN */
#title-screen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(12, 15, 18, 0.95);
    backdrop-filter: blur(10px);
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    z-index: 10000;
}

#title-screen h1 {
    font-size: 2.8rem;
    margin-bottom: 5px;
    color: #ffffff;
}

.author-tag {
    color: var(--accent);
    font-size: 1.1rem;
    font-weight: bold;
    margin-bottom: 25px;
    letter-spacing: 1px;
}

.theme-btn {
    padding: 15px 30px;
    margin: 10px;
    cursor: pointer;
    font-size: 1.1rem;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    transition: transform 0.2s;
}

.theme-btn:hover {
    transform: scale(1.05);
}

.dark-btn { background: #161a1e; color: #ffffff; border: 1px solid #00ffcc; }
.light-btn { background: #ffffff; color: #000000; border: 1px solid #0284c7; }

/* MAIN APP */
#main-app {
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.nav-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
}

.nav-controls {
    display: flex;
    align-items: center;
    gap: 10px;
}

/* 🔍 FIXED SEARCH LAYOUT */
.search-container {
    display: flex;
    align-items: center;
    background: var(--input);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 6px;
    padding: 2px 5px;
}

.light-theme .search-container {
    border: 1px solid rgba(0,0,0,0.1);
}

.search-input {
    background: transparent;
    border: none;
    color: var(--text);
    padding: 8px 12px;
    font-size: 0.95rem;
    outline: none;
    width: 160px;
}

.search-btn {
    background: var(--accent);
    color: #000000;
    border: none;
    padding: 8px 15px;
    border-radius: 4px;
    cursor: pointer;
    font-weight: bold;
    font-size: 0.9rem;
}

.switch-btn {
    padding: 10px 20px;
    cursor: pointer;
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--accent);
    border-radius: 5px;
}

/* DASHBOARD LAYOUT */
.dashboard-container {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
}

#chart {
    flex: 2.5;
    min-width: 300px;
    height: 500px;
    background: var(--panel);
    border-radius: 8px;
}

#coin-list {
    flex: 1;
    min-width: 280px;
    max-height: 500px;
    overflow-y: auto;
    background: var(--panel);
    padding: 10px;
    border-radius: 8px;
}

.crypto-card {
    background: rgba(255,255,255,0.04);
    padding: 12px 15px;
    margin-bottom: 8px;
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: background 0.2s;
}

.light-theme .crypto-card {
    background: rgba(0,0,0,0.04);
}

.crypto-card:hover {
    background: var(--accent);
    color: #000000 !important;
}

.crypto-card:hover div, .crypto-card:hover span {
    color: #000000 !important;
}
</style>
</head>

<body>

<!-- 🎬 Title / Splash Screen -->
<div id="title-screen">
    <h1>SYK's Crypto Dashboard</h1>
    <div class="author-tag">made by koli</div>
    <p style="color: #aaa; margin-bottom: 20px;">Pick your starting theme style:</p>
    <div>
        <button class="theme-btn dark-btn" onclick="selectTheme('dark')">🌙 Dark Mode</button>
        <button class="theme-btn light-btn" onclick="selectTheme('light')">☀️ Light Mode</button>
    </div>
</div>

<!-- 📊 Main App Screen -->
<div id="main-app">
    <div class="nav-bar">
        <h1>SYK's Live Tracker</h1>
        
        <div class="nav-controls">
            <!-- Form tags removed to completely prevent automatic enter-refresh wipes -->
            <div class="search-container">
                <input type="text" id="crypto-search" class="search-input" placeholder="Search coin (e.g. SOL, DOGE)..." onkeydown="handleSearchKeyPress(event)">
                <button class="search-btn" onclick="executeSearch()">Go</button>
            </div>
            <button class="switch-btn" onclick="toggleTheme()">🌓 Switch Theme</button>
        </div>
    </div>

    <div class="dashboard-container">
        <div id="chart"></div>
        <div id="coin-list">
            <p style="padding: 10px;">Connecting live streaming nodes...</p>
        </div>
    </div>
</div>

<!-- 🔒 STABLE CDN WIDGET SCRIPTS -->
<script src="https://tradingview.com"></script>

<script>
let currentTheme = "dark";
let currentSymbol = "BTC";

const coinsMeta = {
    'BTC': { name: 'Bitcoin' },
    'ETH': { name: 'Ethereum' },
    'SOL': { name: 'Solana' },
    'BNB': { name: 'BNB' },
    'XRP': { name: 'Ripple' },
    'ADA': { name: 'Cardano' },
    'DOGE': { name: 'Dogecoin' },
    'DOT': { name: 'Polkadot' },
    'LINK': { name: 'Chainlink' },
    'AVAX': { name: 'Avalanche' }
};

function selectTheme(theme){
    currentTheme = theme;
    if(theme === "light"){
        document.body.classList.add("light-theme");
    }
    document.getElementById("title-screen").style.display = "none";
    loadChart(currentSymbol);
    startLivePriceStream();
}

function toggleTheme(){
    document.body.classList.toggle("light-theme");
    currentTheme = currentTheme === "dark" ? "light" : "dark";
    loadChart(currentSymbol);
}

function loadChart(symbol){
    currentSymbol = symbol.toUpperCase();
    const chartDiv = document.getElementById("chart");
    chartDiv.innerHTML = "";

    // Ultimate structural check: waits gracefully if global library script delay happens
    if (typeof TradingView === 'undefined' || !TradingView.widget) {
        chartDiv.innerHTML = "<p style='padding:20px; color:#888;'>Synchronizing trading engine tickers...</p>";
        setTimeout(() => loadChart(symbol), 800);
        return;
    }

    new TradingView.widget({
        container_id: "chart",
        width: "100%",
        height: "100%",
        symbol: "BINANCE:" + currentSymbol + "USDT",
        interval: "30",
        theme: currentTheme,
        style: "1",
        toolbar_bg: currentTheme === "dark" ? "#161a1e" : "#ffffff",
        enable_publishing: false,
        hide_side_toolbar: false,
        allow_symbol_change: true
    });
}

function executeSearch() {
    const inputField = document.getElementById("crypto-search");
    const query = inputField.value.trim();
    if (query !== "") {
        loadChart(query);
        inputField.value = ""; // Safely blank field after injection occurs
    }
}

function handleSearchKeyPress(event) {
    if (event.key === "Enter") {
        event.preventDefault(); // HALTS form-erase cycle dead in its tracks
        executeSearch();
    }
}

function startLivePriceStream() {
    const listContainer = document.getElementById("coin-list");
    listContainer.innerHTML = "";
    
    Object.keys(coinsMeta).forEach(sym => {
        const card = document.createElement("div");
        card.className = "crypto-card";
        card.id = `card-${sym}`;
        card.setAttribute("onclick", `loadChart('${sym}')`);
        card.innerHTML = `
            <div><strong>${sym}</strong><div style="font-size:0.75rem; color:#888;">${coinsMeta[sym].name}</div></div>
            <div style="text-align: right;">
                <div id="price-${sym}" style="font-weight: bold;">$--.--</div>
                <span id="percent-${sym}" style="font-size: 0.85rem; font-weight: bold;">0.00%</span>
            </div>
        `;
        listContainer.appendChild(card);
    });

    const streams = Object.keys(coinsMeta).map(sym => `${sym.toLowerCase()}usdt@ticker`).join('/');
    const ws = new WebSocket(`wss://://binance.com{streams}`);

    ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        const sym = data.s.replace("USDT", "");
        
        const price = parseFloat(data.c);
        const percentage = parseFloat(data.P);
        
        const priceEl = document.getElementById(`price-${sym}`);
        const percentEl = document.getElementById(`percent-${sym}`);
        
        if(priceEl && percentEl) {
            priceEl.innerText = `$${price.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
            
            const changeColor = percentage >= 0 ? "#00ffcc" : "#ff4a5a";
            const prefix = percentage >= 0 ? "+" : "";
            
            percentEl.innerText = `${prefix}${percentage.toFixed(2)}%`;
            percentEl.style.color = changeColor;
        }
    };

    ws.onerror = (err) => { console.error("Stream break diagnostic logs:", err); };
    ws.onclose = () => { setTimeout(startLivePriceStream, 2000); };
}
</script>

</body>
</html>
