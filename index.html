<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SYK's Crypto Dashboard</title>

<style>
:root {
    --bg: #0c0f12;
    --panel: #161a1e;
    --text: #ffffff;
    --accent: #00ffcc;
    --input: #23282f;
}

.light-theme {
    --bg: #f4f6f9;
    --panel: #ffffff;
    --text: #000000;
    --accent: #0284c7;
    --input: #e2e8f0;
}

body {
    background: var(--bg);
    color: var(--text);
    font-family: Arial, sans-serif;
    margin: 0;
}

#title-screen {
    position: fixed;
    inset: 0;
    background: rgba(12, 15, 18, 0.95);
    backdrop-filter: blur(10px);
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    z-index: 10000;
}

#title-screen h1 {
    font-size: 2.5rem;
}

.theme-btn {
    padding: 12px 25px;
    margin: 10px;
    cursor: pointer;
    border: none;
    border-radius: 8px;
    font-weight: bold;
}

.dark-btn { background: #161a1e; color: #fff; border: 1px solid #00ffcc; }
.light-btn { background: #fff; color: #000; border: 1px solid #0284c7; }

#main-app {
    display: none;
    padding: 20px;
    flex-direction: column;
    gap: 20px;
}

.nav-bar {
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
}

.search-container {
    display: flex;
    background: var(--input);
    border-radius: 6px;
    overflow: hidden;
}

.search-input {
    border: none;
    padding: 8px;
    background: transparent;
    color: var(--text);
    outline: none;
}

.search-btn {
    background: var(--accent);
    border: none;
    padding: 8px 12px;
    cursor: pointer;
}

.switch-btn {
    padding: 8px 12px;
    border: 1px solid var(--accent);
    background: var(--panel);
    color: var(--text);
    cursor: pointer;
    border-radius: 6px;
}

.dashboard-container {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
}

#tv-widget {
    flex: 2;
    min-width: 300px;
    height: 500px;
    background: var(--panel);
    border-radius: 8px;
}

#coin-list {
    flex: 1;
    min-width: 250px;
    max-height: 500px;
    overflow-y: auto;
    background: var(--panel);
    padding: 10px;
    border-radius: 8px;
}

.crypto-card {
    padding: 12px;
    margin-bottom: 8px;
    background: rgba(255,255,255,0.05);
    border-radius: 6px;
    cursor: pointer;
}

.crypto-card:hover {
    background: var(--accent);
    color: #000;
}
</style>
</head>

<body>

<!-- SPLASH -->
<div id="title-screen">
    <h1>SYK's Crypto Dashboard</h1>
    <p style="color:#aaa;">Choose theme</p>
    <div>
        <button class="theme-btn dark-btn" onclick="selectTheme('dark')">Dark</button>
        <button class="theme-btn light-btn" onclick="selectTheme('light')">Light</button>
    </div>
</div>

<!-- MAIN APP -->
<div id="main-app">

    <div class="nav-bar">
        <h2>Crypto Tracker</h2>

        <div class="search-container">
            <input id="crypto-search" class="search-input" placeholder="BTC, ETH..." onkeydown="handleSearchKeyPress(event)">
            <button class="search-btn" onclick="executeSearch()">Go</button>
        </div>

        <button class="switch-btn" onclick="toggleTheme()">Toggle Theme</button>
    </div>

    <div class="dashboard-container">

        <div id="tv-widget"></div>

        <div id="coin-list">
            <div class="crypto-card" onclick="changeChart('BTC')">BTC</div>
            <div class="crypto-card" onclick="changeChart('ETH')">ETH</div>
            <div class="crypto-card" onclick="changeChart('SOL')">SOL</div>
            <div class="crypto-card" onclick="changeChart('BNB')">BNB</div>
            <div class="crypto-card" onclick="changeChart('XRP')">XRP</div>
            <div class="crypto-card" onclick="changeChart('ADA')">ADA</div>
        </div>

    </div>
</div>

<!-- ✅ FIXED TRADINGVIEW LIBRARY -->
<script src="https://s3.tradingview.com/tv.js"></script>

<script>
let currentTheme = "dark";
let currentSymbol = "BTC";

function selectTheme(theme){
    currentTheme = theme;

    if(theme === "light"){
        document.body.classList.add("light-theme");
    } else {
        document.body.classList.remove("light-theme");
    }

    document.getElementById("title-screen").style.display = "none";
    document.getElementById("main-app").style.display = "flex";

    setTimeout(() => loadChart("BTC"), 300);
}

function toggleTheme(){
    document.body.classList.toggle("light-theme");
    currentTheme = currentTheme === "dark" ? "light" : "dark";
    loadChart(currentSymbol);
}

function changeChart(symbol){
    currentSymbol = symbol;
    loadChart(symbol);
}

function loadChart(symbol){

    if(!window.TradingView){
        setTimeout(() => loadChart(symbol), 500);
        return;
    }

    document.getElementById("tv-widget").innerHTML = "";

    new TradingView.widget({
        container_id: "tv-widget",
        width: "100%",
        height: "100%",
        symbol: "BINANCE:" + symbol + "USDT",
        interval: "30",
        timezone: "Etc/UTC",
        theme: currentTheme,
        style: "1",
        locale: "en",
        allow_symbol_change: true
    });
}

function executeSearch(){
    const input = document.getElementById("crypto-search");
    if(input.value.trim()){
        changeChart(input.value.trim().toUpperCase());
        input.value = "";
    }
}

function handleSearchKeyPress(e){
    if(e.key === "Enter"){
        e.preventDefault();
        executeSearch();
    }
}
</script>

</body>
</html>
