<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crypto Dashboard</title>

<style>
:root {
    --bg: #0c0f12;
    --panel: #161a1e;
    --text: #ffffff;
    --accent: #00ffcc;
}

.light-theme {
    --bg: #f4f6f9;
    --panel: #ffffff;
    --text: #000000;
    --accent: #0284c7;
}

body {
    background: var(--bg);
    color: var(--text);
    font-family: Arial;
    margin: 0;
}

/* TITLE SCREEN */
#title-screen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(12, 15, 18, 0.95);
    backdrop-filter: blur(10px);
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    z-index: 10000;
}

#title-screen h1 {
    font-size: 2.5rem;
    margin-bottom: 20px;
    color: #ffffff;
}

.theme-btn {
    padding: 15px 30px;
    margin: 10px;
    cursor: pointer;
    font-size: 1.1rem;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    transition: transform 0.2s;
}

.theme-btn:hover {
    transform: scale(1.05);
}

.dark-btn { background: #161a1e; color: #ffffff; border: 1px solid #00ffcc; }
.light-btn { background: #ffffff; color: #000000; border: 1px solid #0284c7; }

/* MAIN APP */
#main-app {
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.nav-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.switch-btn {
    padding: 10px 20px;
    cursor: pointer;
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--accent);
    border-radius: 5px;
}

/* DASHBOARD LAYOUT */
.dashboard-container {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
}

#chart {
    flex: 2;
    min-width: 300px;
    height: 500px;
    background: var(--panel);
    border-radius: 8px;
}

#coin-list {
    flex: 1;
    min-width: 250px;
    max-height: 500px;
    overflow-y: auto;
    background: var(--panel);
    padding: 10px;
    border-radius: 8px;
}

.crypto-card {
    background: rgba(255,255,255,0.05);
    padding: 15px;
    margin-bottom: 10px;
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    transition: background 0.2s;
}

.light-theme .crypto-card {
    background: rgba(0,0,0,0.05);
}

.crypto-card:hover {
    background: var(--accent);
    color: #000000;
}
</style>
</head>

<body>

<!-- 🎬 Title / Splash Screen -->
<div id="title-screen">
    <h1>Crypto Dashboard</h1>
    <p style="color: #aaa; margin-bottom: 20px;">Pick your starting theme style:</p>
    <div>
        <button class="theme-btn dark-btn" onclick="selectTheme('dark')">🌙 Dark Mode</button>
        <button class="theme-btn light-btn" onclick="selectTheme('light')">☀️ Light Mode</button>
    </div>
</div>

<!-- 📊 Main App Screen -->
<div id="main-app">
    <div class="nav-bar">
        <h1>Top 15 Live Coins</h1>
        <button class="switch-btn" onclick="toggleTheme()">🌓 Switch Theme</button>
    </div>

    <div class="dashboard-container">
        <!-- TradingView Chart -->
        <div id="chart"></div>

        <!-- Dynamic Crypto List -->
        <div id="coin-list">
            <p style="padding: 10px;">Loading live prices...</p>
        </div>
    </div>
</div>

<!-- TradingView Widget Script -->
<script src="https://s3.tradingview.com/tv.js"></script>

<script>
let currentTheme = "dark";
let currentSymbol = "BTC";

// 1. Theme Picker from Title Screen
function selectTheme(theme){
    currentTheme = theme;
    if(theme === "light"){
        document.body.classList.add("light-theme");
    }
    document.getElementById("title-screen").style.display = "none";
    loadChart(currentSymbol);
    fetchCryptoPrices();
}

// 2. Toggle Theme Inside App
function toggleTheme(){
    document.body.classList.toggle("light-theme");
    currentTheme = currentTheme === "dark" ? "light" : "dark";
    loadChart(currentSymbol);
}

// 3. Load TradingView Widget
function loadChart(symbol){
    currentSymbol = symbol;
    document.getElementById("chart").innerHTML = "";

    new TradingView.widget({
        container_id: "chart",
        width: "100%",
        height: "100%",
        symbol: "BINANCE:" + symbol + "USDT",
        interval: "30",
        theme: currentTheme,
        style: "1",
        toolbar_bg: currentTheme === "dark" ? "#161a1e" : "#ffffff",
        enable_publishing: false,
        hide_side_toolbar: false,
        allow_symbol_change: true
    });
}

// 4. Fetch Live Data from Crypto API (Replaces Python requests)
async function fetchCryptoPrices() {
    try {
        const response = await fetch("https://coingecko.com");
        const coins = await response.json();
        
        const listContainer = document.getElementById("coin-list");
        listContainer.innerHTML = ""; // Clear loader text

        coins.forEach(coin => {
            const coinCard = document.createElement("div");
            coinCard.className = "crypto-card";
            coinCard.setAttribute("onclick", `loadChart('${coin.symbol.toUpperCase()}')`);
            
            coinCard.innerHTML = `
                <strong>${coin.name} (${coin.symbol.toUpperCase()})</strong>
                <span>$${coin.current_price.toLocaleString()}</span>
            `;
            listContainer.appendChild(coinCard);
        });
    } catch (error) {
        document.getElementById("coin-list").innerHTML = "<p style='color:red; padding:10px;'>Error loading prices. Try refreshing!</p>";
        console.error("API Error:", error);
    }
}
</script>

</body>
</html>
